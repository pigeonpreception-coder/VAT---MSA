# Nginx vhost for vat.safi-nuru.com.
#
# Install: copy to /etc/nginx/sites-available/vat-msa, then
#   ln -s /etc/nginx/sites-available/vat-msa /etc/nginx/sites-enabled/vat-msa
#   nginx -t && systemctl reload nginx
# Then run certbot (see deploy/README.md) -- it edits this file in place to
# add the ssl_certificate/listen 443 directives and the :80 -> :443 redirect,
# so this file is intentionally HTTP-only until certbot has run once.
#
# Assumes the app is checked out at /var/www/vat-msa (php-app/ inside it) and
# PHP-FPM is listening on the unix socket configured in
# deploy/php-fpm/vat-msa-pool.conf. Adjust both paths here if yours differ.

server {
    listen 80;
    listen [::]:80;
    server_name vat.safi-nuru.com;

    root /var/www/vat-msa/php-app/public;
    index index.php;

    # Real max upload size for a document/evidence upload -- match
    # App\Services\Document\DocumentService's own size bound (10 MiB) plus
    # headroom for multipart overhead. Keep in sync if that bound changes.
    client_max_body_size 12m;

    charset utf-8;

    access_log /var/log/nginx/vat-msa-access.log;
    error_log  /var/log/nginx/vat-msa-error.log;

    # Laravel's own front-controller routing.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/vat-msa.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # storage/app/private and .env are already outside the nginx root
    # (public/ is the only web-served directory), so this is defense in
    # depth against a misconfigured root, not the only thing stopping
    # direct access to them.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Never let nginx serve documents/exports directly -- every real read
    # goes through the app's authenticated download routes (see
    # docs/DEPLOYMENT.md's "Storage" section). There is no storage:link
    # symlink in this app, so this should already be unreachable; block it
    # explicitly anyway in case one is ever created by mistake.
    location ^~ /storage/ {
        deny all;
    }
}
