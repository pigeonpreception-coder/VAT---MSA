; PHP-FPM pool for vat.safi-nuru.com.
;
; Install: copy to /etc/php/8.4/fpm/pool.d/vat-msa.conf (remove or rename
; the stock www.conf pool in the same directory so it doesn't also bind
; port 9000/a socket and conflict), then:
;   systemctl restart php8.4-fpm
;
; Runs as a dedicated `vatmsa` system user (see deploy/README.md's
; provisioning steps for creating it) rather than www-data, so the deployed
; code and its writable directories (storage/, bootstrap/cache/) are owned
; by the same account that runs it -- nginx (www-data) only needs to reach
; the fastcgi socket, not own any of the application's files.

[vat-msa]
user = vatmsa
group = vatmsa

; nginx (running as www-data) connects to this socket -- group-readable by
; www-data so it can, without making the app's own files group-writable.
listen = /run/php/vat-msa.sock
listen.owner = vatmsa
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Restart workers periodically -- cheap insurance against any slow memory
; growth across the process lifetime; harmless if none exists.
pm.max_requests = 500

php_admin_value[error_log] = /var/log/php-fpm/vat-msa-error.log
php_admin_flag[log_errors] = on
