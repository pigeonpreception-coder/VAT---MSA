; php.ini overrides for vat.safi-nuru.com.
;
; Install: copy to /etc/php/8.4/fpm/conf.d/99-vat-msa.ini, then
;   systemctl restart php8.4-fpm
;
; OPcache settings are exactly what docs/DEPLOYMENT.md's "Performance:
; OPcache and framework caching" section requires -- RT-004 measured
; ~500ms/request with OPcache disabled, so this is not a tuning nicety.
; validate_timestamps=0 is safe here specifically because deploy/deploy.sh
; reloads php-fpm on every release (see that script) -- if a future deploy
; path stops doing that, switch to validate_timestamps=1 + revalidate_freq=0
; instead (see the docs section for why).
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.max_accelerated_files=20000

; Stock php.ini defaults (upload_max_filesize=2M, post_max_size=8M) are
; smaller than App\Services\Document\DocumentService's own 10 MiB upload
; bound -- without this, a legitimate 8-10 MiB document would be silently
; truncated/rejected by PHP before the application's own size check ever
; runs. post_max_size must exceed upload_max_filesize (multipart overhead).
upload_max_filesize = 11M
post_max_size = 12M
