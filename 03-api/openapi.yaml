openapi: 3.1.0
info:
  title: VAT-MSA Fiscal Transaction API
  version: 0.9.0
  summary: Controlled self-serve onboarding plus centrally licensed identity, business, VAT, evidence, search and platform-edge contracts.
  description: |
    Architecture-baseline contract only. Legal invoice particulars, authentication profiles,
    error codes, signature formats, retention and service levels require NamRA approval.
    Every protected operation is classified by authority domain. Government-tax features use
    the independent Government Tax Authorization Service; commercial features use the License
    & Entitlement Service; platform-control permissions do not imply either domain membership.
    Suspended, expired and cancelled commercial licences preserve records and approved continuity.
x-vat-msa-license-enforcement:
  policy_authority: license_permission_policies
  authority_domains: [GOVERNMENT_TAX, COMMERCIAL_SAAS, PLATFORM_CONTROL]
  evaluation_order: [identity, tenant_or_jurisdiction, permission, feature_authority_domain, domain_specific_authorization, usage_limit, security_policy, workflow, segregation_of_duties]
  restricted_states: [SUSPENDED, EXPIRED, CANCELLED]
  continuity_operations: [READ, EXPORT, COMPLIANCE_WRITE, CORRECTION_WRITE]
  denied_operations_after_restriction: [BUSINESS_WRITE, ADMIN_WRITE]
  public_exemptions: [/health/live, /health/ready, /v1/signup-applications, '/v1/verify/{token}']
  failure_mode: deny
servers:
  - url: https://sandbox.api.vat-msa.na
    description: Conformance sandbox
  - url: https://api.vat-msa.na
    description: Production (proposed)
security:
  - oauth2: [invoices.write]
tags:
  - name: Signup
  - name: Identity
  - name: Identity proofing
  - name: Authority governance
  - name: Organisations
  - name: Registrations
  - name: Quotations
  - name: Accounting
  - name: Expenses
  - name: Inventory
  - name: Projects
  - name: VAT periods
  - name: VAT returns
  - name: Approvals
  - name: Compliance
  - name: Audit cases
  - name: Disputes
  - name: Refunds
  - name: Invoices
  - name: Certificates
  - name: Platform
  - name: Documents
  - name: Reports
  - name: Offline
  - name: Verification
  - name: Audit
  - name: Integrations
  - name: Analytics
  - name: Navigation
  - name: Counterparties
  - name: Notifications
  - name: Obligations
  - name: Users
  - name: VAT rules
  - name: Audit evidence
  - name: Developer
  - name: SaaS providers
  - name: Security
  - name: Taxpayers
  - name: Access grants
  - name: Portals
  - name: Risk indicators
  - name: SaaS applications
  - name: Workflows
  - name: Communications
  - name: Exceptions
  - name: Payments
  - name: Taxpayer systems
  - name: Fixed assets
  - name: Logistics
paths:
  /v1/signup-applications:
    post:
      tags: [Signup]
      operationId: submitSelfServeSignup
      summary: Submit a controlled company-commercial application as the attested Company System Administrator.
      x-authority-domain: COMMERCIAL_SAAS
      description: |
        This public, rate-limited intake records explicit Company System Administrator attestation,
        organisation identity, consent and a configurable commercial placeholder-plan request. Acceptance creates only
        an immutable pending-verification application. It never creates a user, taxpayer,
        organisation, subscription or licence and never triggers payment, email, SMS or live
        ITAS/NamRA activity. A trusted Sites/ChatGPT identity assertion may be recorded when
        present, but it does not provision access.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelfServeSignupSubmission' }
      responses:
        '202':
          description: Application accepted and held pending administrator and organisation verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelfServeSignupAccepted' }
        '403':
          description: COMPANY_ADMIN_AUTHORITY_REQUIRED; ordinary employees must use invitation or sign-in.
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: Request exceeds the 32 KiB signup limit.
        '415':
          description: Content-Type is not application/json.
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: Public signup rate budget exceeded.
  /v1/licensing/license:
    get:
      tags: [Organisations]
      operationId: getEffectiveOrganisationLicense
      summary: Read the authoritative licence, enabled features, limits and current usage for the resolved organisation.
      security:
        - oauth2: [licensing.read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: organisation_id
          in: query
          schema: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Current non-priced placeholder plan, licence state and entitlements.
          content:
            application/json:
              schema:
                type: object
                required: [organisation, license, entitlements]
                properties:
                  organisation: { type: object, additionalProperties: true }
                  license:
                    type: object
                    required: [state, retention_policy]
                    properties:
                      state: { $ref: '#/components/schemas/LicenseState' }
                      retention_policy: { type: string }
                      price: { type: 'null' }
                    additionalProperties: true
                  entitlements: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/navigation/workspace:
    get:
      tags: [Organisations]
      operationId: getEffectiveLicensedWorkspace
      summary: Return only navigation destinations permitted by role, feature entitlement and current licence continuity state.
      security:
        - oauth2: [workspace.read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Effective server-generated workspace projection including safe licence-state context.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/search:
    get:
      tags: [Organisations]
      operationId: searchLicensedWorkspace
      summary: Search only licensed, tenant-scoped, permission-visible records; historical search remains available in continuity mode.
      security:
        - oauth2: [search.read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
      responses:
        '200':
          description: Bounded authorised search results.
          content:
            application/json:
              schema: { type: object, required: [query, results], properties: { query: { type: string }, results: { type: array, items: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organisations:
    get:
      tags: [Organisations]
      operationId: listOrganisations
      summary: List canonical organisations visible to the authenticated identity.
      security:
        - oauth2: [identity.read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Tenant-scoped organisation summaries.
          content:
            application/json:
              schema:
                type: object
                required: [organisations]
                properties:
                  organisations:
                    type: array
                    items: { $ref: '#/components/schemas/OrganisationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/organisations/{organisation_id}:
    get:
      tags: [Organisations]
      operationId: getOrganisation
      summary: Get an authorised organisation with identifiers, capabilities, branches and memberships.
      security:
        - oauth2: [identity.read]
      parameters:
        - $ref: '#/components/parameters/OrganisationId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Canonical organisation detail. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/registration-applications:
    get:
      tags: [Registrations]
      operationId: listRegistrationApplications
      summary: List registration applications within the caller's authorised scope.
      security:
        - oauth2: [registrations.read]
      responses:
        '200':
          description: Registration applications and authoritative verification posture.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Registrations]
      operationId: submitRegistrationApplication
      summary: Submit an idempotent legal taxpayer registration for authoritative verification.
      description: Acceptance does not create a taxpayer or organisation. ITAS/NamRA verification and controlled approval must complete first.
      security:
        - oauth2: [registrations.submit]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationSubmission' }
      responses:
        '202':
          description: Accepted and held pending authoritative verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/identity-proofing-cases:
    get:
      tags: [Identity proofing]
      operationId: listIdentityProofingCases
      summary: List explainable identity-proofing cases within the caller's authorised scope.
      description: |
        Returns the durable proofing posture and confidence evidence created for registration
        applications. Synthetic results are explicitly labelled and never constitute NamRA/ITAS
        authority verification or create taxpayer, organisation, membership or licence records.
      security:
        - oauth2: [registrations.read]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Scoped identity-proofing queue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [identity_proofing_cases]
                properties:
                  identity_proofing_cases:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/IdentityProofingCase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tax-authority-onboarding-cases:
    get:
      tags: [Authority governance]
      operationId: getTaxAuthorityGovernance
      summary: Read scoped authority hierarchy, roles, federation, onboarding and quarterly-review posture.
      description: Returns governance metadata only for Tax Authorities explicitly assigned to the caller. Authentication does not create authority membership.
      security: [{ oauth2: [authority-governance.read] }]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Scoped Tax Authority governance projection with production activation disabled. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Authority governance]
      operationId: createTaxAuthorityOnboardingCase
      summary: Create an idempotent, step-up protected Tax Authority onboarding case.
      description: |
        Local/staging requests enter independent review. Production-target requests are durably recorded as
        `BLOCKED_EXTERNAL`; this command cannot activate federation, an authority, a tax subscription or taxpayer access.
      security: [{ oauth2: [authority-governance.manage] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StepUpEvidence'
        - $ref: '#/components/parameters/StepUpSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, tax_authority_id, target_environment, purpose]
              properties:
                schema_version: { type: string, const: 1.0.0 }
                tax_authority_id: { type: string, minLength: 3, maxLength: 100 }
                target_environment: { type: string, enum: [LOCAL_STAGING, PRODUCTION] }
                purpose: { type: string, minLength: 10, maxLength: 500 }
                evidence_bundle_hash: { type: string, minLength: 32, maxLength: 200 }
                readiness_reference: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '201': { description: Local review case or production-blocked evidence record created with no activation effect. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/tax-authority-onboarding-cases/{onboarding_case_id}/decisions:
    post:
      tags: [Authority governance]
      operationId: decideTaxAuthorityOnboardingCase
      summary: Record an independent immutable local-staging approval or rejection.
      description: |
        Requires single-use step-up evidence, an active authority administrator assignment, a protected decision role,
        a current quarterly access review and a different requester/decider. Production activation is not exposed.
      security: [{ oauth2: [authority-governance.manage] }]
      parameters:
        - { name: onboarding_case_id, in: path, required: true, schema: { type: string, minLength: 1 } }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/StepUpEvidence'
        - $ref: '#/components/parameters/StepUpSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, decision, reason]
              properties:
                schema_version: { type: string, const: 1.0.0 }
                decision: { type: string, enum: [APPROVE_LOCAL_STAGING, REJECT] }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200': { description: Independent immutable local decision recorded with no production activation effect. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/quotations:
    get:
      tags: [Quotations]
      operationId: listQuotations
      summary: List quotations in the authorised organisation.
      security: [{ oauth2: [commercial.read] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Tenant-scoped quotation register. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Quotations]
      operationId: createQuotation
      summary: Issue a quotation whose monetary and tax totals are calculated server-side.
      security: [{ oauth2: [quotations.manage] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuotationSubmission' } } }
      responses:
        '201': { description: Quotation issued. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/quotations/{quotation_id}:
    patch:
      tags: [Quotations]
      operationId: updateQuotation
      summary: Append an immutable revision and update an unexpired issued quotation.
      security: [{ oauth2: [quotations.manage] }]
      parameters:
        - name: quotation_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuotationSubmission' } } }
      responses:
        '200': { description: Quotation updated and immutable revision appended. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/quotations/{quotation_id}/accept:
    post:
      tags: [Quotations]
      operationId: acceptQuotation
      summary: Accept an unexpired issued quotation using an idempotent state transition.
      security: [{ oauth2: [quotations.manage] }]
      parameters:
        - name: quotation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Quotation accepted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/quotations/{quotation_id}/rejection:
    post:
      tags: [Quotations]
      operationId: rejectQuotation
      summary: Reject an unexpired issued quotation with a protected reason.
      security: [{ oauth2: [quotations.manage] }]
      parameters:
        - name: quotation_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuotationRejectionSubmission' } } }
      responses:
        '200': { description: Quotation rejected without deleting its history. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/quotations/{quotation_id}/expiration:
    post:
      tags: [Quotations]
      operationId: expireQuotation
      summary: Explicitly expire an issued quotation after its valid-until date.
      security: [{ oauth2: [quotations.manage] }]
      parameters:
        - name: quotation_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Overdue quotation explicitly expired. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/quotations/{quotation_id}/convert:
    post:
      tags: [Quotations, Invoices]
      operationId: convertQuotationToInvoice
      summary: Certify an accepted quotation as an invoice and preserve its source lineage.
      security: [{ oauth2: [quotations.manage, invoices.write] }]
      parameters:
        - name: quotation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuotationConversionSubmission' } } }
      responses:
        '201': { description: Invoice certified and quotation linked. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/accounting/journals:
    get:
      tags: [Accounting]
      operationId: listJournals
      summary: List journals in the authorised organisation.
      security: [{ oauth2: [accounting.read] }]
      responses: { '200': { description: Tenant-scoped journal register. } }
    post:
      tags: [Accounting]
      operationId: postJournal
      summary: Post a balanced double-entry journal.
      security: [{ oauth2: [accounting.post] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JournalSubmission' } } }
      responses:
        '201': { description: Balanced journal posted. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/expenses:
    get:
      tags: [Expenses]
      operationId: listExpenses
      summary: List expenses in the authorised organisation.
      security: [{ oauth2: [expenses.read] }]
      responses: { '200': { description: Tenant-scoped expense register. } }
    post:
      tags: [Expenses]
      operationId: createExpense
      summary: Record a draft expense with exact integer totals.
      security: [{ oauth2: [expenses.manage] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExpenseSubmission' } } }
      responses:
        '201': { description: Draft expense recorded. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/expenses/{expense_id}/decision:
    post:
      tags: [Expenses]
      operationId: decideExpense
      summary: Independently approve or reject a draft expense and append immutable decision evidence.
      security: [{ oauth2: [expenses.approve] }]
      parameters:
        - name: expense_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExpenseDecisionSubmission' } } }
      responses:
        '200': { description: Independent decision recorded and draft expense transitioned. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/expenses/{expense_id}/receipt:
    post:
      tags: [Expenses]
      operationId: linkExpenseReceipt
      summary: Immutably link a clean, available receipt to a draft expense.
      description: Quarantined, pending, rejected, cross-tenant, incorrectly owned or already-linked documents are refused.
      security: [{ oauth2: [expenses.manage] }]
      parameters:
        - name: expense_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExpenseReceiptLinkSubmission' } } }
      responses:
        '200': { description: Clean receipt linked to the draft expense with immutable custody evidence. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/inventory/movements:
    get:
      tags: [Inventory]
      operationId: listInventoryBalances
      summary: List inventory balances in the authorised organisation.
      security: [{ oauth2: [inventory.read] }]
      responses: { '200': { description: Tenant-scoped inventory balances. } }
    post:
      tags: [Inventory]
      operationId: recordStockMovement
      summary: Record a signed stock movement without permitting negative on-hand stock.
      security: [{ oauth2: [inventory.manage] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StockMovementSubmission' } } }
      responses:
        '201': { description: Stock movement recorded. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects and budget-to-cost projections in the authorised organisation.
      security: [{ oauth2: [projects.read] }]
      responses: { '200': { description: Tenant-scoped project register. } }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a planned project and optional proposed budget.
      security: [{ oauth2: [projects.manage] }]
      parameters:
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectSubmission' } } }
      responses:
        '201': { description: Project created. }
