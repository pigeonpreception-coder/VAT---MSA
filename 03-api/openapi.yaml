      operationId: rejectExpenseSubmission
      summary: Reject a submitted expense with a protected reason, enforcing that the rejector did not create it.
      security: [{ oauth2: [expenses.manage] }]
      parameters:
        - name: expense_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, reason]
              properties:
                schema_version: { type: string, const: 1.0.0 }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: Expense rejected. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/expenses/{expense_id}/submission:
    post:
      tags: [Expenses]
      operationId: submitExpenseForApproval
      summary: Move a draft expense into the maker-checker approval queue.
      security: [{ oauth2: [expenses.manage] }]
      parameters:
        - name: expense_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Draft expense submitted for approval. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/payments/outstanding:
    get:
      tags: [Payments]
      operationId: listOutstandingRefundPayments
      summary: List refund claims awaiting payment and the connector's current posture; restricted to national refund roles.
      security: [{ oauth2: [payments.read] }]
      responses:
        '200': { description: Outstanding refund payment queue with a running total and connector status. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/projects/{project_id}/profitability:
    get:
      tags: [Projects]
      operationId: getProjectProfitability
      summary: Report a project's budget, actual cost and recognised revenue for margin analysis.
      security: [{ oauth2: [projects.read] }]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/OrganisationScope'
      responses:
        '200': { description: Project profitability projection. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/projects/{project_id}/budget-approval:
    post:
      tags: [Projects]
      operationId: approveProjectBudget
      summary: Approve a project's proposed budget, enforcing that the project's own manager cannot self-approve it.
      security: [{ oauth2: [projects.manage] }]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, approved_amount_cents]
              properties:
                schema_version: { type: string, const: 1.0.0 }
                approved_amount_cents: { type: integer, minimum: 0 }
                notes: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Proposed project budget approved. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/projects/{project_id}/costs:
    post:
      tags: [Projects]
      operationId: postProjectCost
      summary: Post a cost against a project, either citing an already-approved project expense or recording a manual cost.
      security: [{ oauth2: [projects.manage] }]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/OrganisationScope'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, cost_type, source_id]
              properties:
                schema_version: { type: string, const: 1.0.0 }
                cost_type: { type: string, enum: [EXPENSE, MANUAL] }
                source_id: { type: string, minLength: 2, maxLength: 100 }
                amount_cents: { type: integer, minimum: 1 }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                description: { type: string, minLength: 2, maxLength: 500 }
                occurred_at: { type: string, format: date }
      responses:
        '201': { description: Project cost posted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/refunds/{refund_claim_id}/checks:
    get:
      tags: [Refunds]
      operationId: getRefundClaimChecks
      summary: Retrieve a refund claim's eligibility checks and calculation snapshot.
      security: [{ oauth2: [refunds.read] }]
      parameters:
        - name: refund_claim_id
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200': { description: Refund claim eligibility checks and snapshot hash. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/refunds/{refund_claim_id}/disputes:
    post:
      tags: [Refunds]
      operationId: disputeRefundClaim
      summary: Dispute a refund claim's outcome; only the original requester may raise it.
      security: [{ oauth2: [refunds.request] }]
      parameters:
        - name: refund_claim_id
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, action, findings]
              properties:
                schema_version: { type: string, const: 1.0.0 }
                action: { type: string, const: DISPUTE }
                findings: { type: string, minLength: 5, maxLength: 2000 }
      responses:
        '201': { description: Refund claim dispute recorded. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/refunds/{refund_claim_id}/payment:
    post:
      tags: [Refunds]
      operationId: recordRefundPayment
      summary: Record a payment instruction for a refund claim that has reached PAYMENT_PENDING; restricted to national refund roles.
      security: [{ oauth2: [payments.record] }]
      parameters:
        - name: refund_claim_id
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, beneficiary_reference, provider]
              properties:
                schema_version: { type: string, const: 1.0.0 }
                beneficiary_reference: { type: string, minLength: 4, maxLength: 100, description: Masked to its last four characters before storage. }
                provider: { type: string, minLength: 2, maxLength: 60 }
      responses:
        '201': { description: Payment instruction recorded. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/refunds/{refund_claim_id}/payment/allocation:
    post:
      tags: [Refunds]
      operationId: allocateRefundPayment
      summary: Allocate a refund claim's recorded payment instruction against a settlement; restricted to national refund roles.
      security: [{ oauth2: [payments.record] }]
      parameters:
        - name: refund_claim_id
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema_version, settlement_reference, settled_amount_cents]
              properties:
                schema_version: { type: string, const: 1.0.0 }
                settlement_reference: { type: string, minLength: 4, maxLength: 100 }
                settled_amount_cents: { type: integer, minimum: 1 }
      responses:
        '201': { description: Payment instruction allocated against the settlement. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/registration-applications/{application_id}/decision:
    post:
      tags: [Registrations]
      operationId: decideRegistrationApplication
      summary: Independently approve or reject a pending registration application, enforcing that the submitter cannot decide their own.
      security: [{ oauth2: [registrations.approve] }]
      parameters:
        - name: application_id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/StepUpEvidence'
        - $ref: '#/components/parameters/StepUpSessionId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: Registration application decided; an APPROVE provisions the canonical taxpayer and organisation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.vat-msa.na/oauth2/token
          scopes:
            identity.read: Read canonical identity and organisation data within authorised scope.
            registrations.read: Read authorised registration applications.
            registrations.submit: Submit a registration application for verification.
            commercial.read: Read commercial records.
            quotations.manage: Create and transition quotations.
            accounting.read: Read the chart and journal register.
            accounting.post: Post balanced journals.
            expenses.read: Read expenses.
            expenses.manage: Record and transition expenses.
            expenses.approve: Independently approve or reject draft expenses.
            inventory.read: Read inventory balances.
            inventory.manage: Record stock movements.
            projects.read: Read projects.
            projects.manage: Manage projects and budgets.
            returns.generate: Generate versioned VAT returns.
            returns.approve: Decide VAT approvals under maker-checker control.
            returns.submit: Request provider submission of an approved return.
            vat-adjustments.manage: Submit governed VAT adjustments.
            compliance.read: Read authorised compliance records.
            cases.manage: Open and manage evidence-led audit cases.
            disputes.manage: File and manage disputes.
            refunds.request: Request refund eligibility review.
            refunds.review: Perform staged refund review.
            invoices.write: Submit fiscal documents.
            invoices.read: Read documents belonging to the authorised taxpayer.
            certificates.read: Retrieve certification receipts.
            platform.read: Read authorised platform, integration and service-component posture.
            documents.upload: Store tenant-scoped evidence in private quarantine.
            reports.run: Execute allow-listed, tenant-scoped inline reports.
            offline.sync: Synchronise enrolled offline devices.
            audit.read: Read the audit trail and trigger on-demand hash-chain verification.
            integrations.read: Read platform integration connection health and posture.
            integrations.manage: Register, approve, suspend and synchronise platform integrations.
            licensing.manage: Activate, suspend, renew or change the organisation's licence plan.
            organisations.manage: Manage organisation branches, invitations and memberships.
            administration.read: Read organisation administrator assignments.
            administration.manage: Appoint organisation administrators.
            roles.read: Read organisation-level capability grants.
            roles.manage: Grant organisation-level capabilities to members.
            employees.manage: Activate organisation employees.
            access-governance.manage: Offboard organisation members and revoke their access grants.
            reports.read: Read certified analytics data products, metrics and anomaly candidates.
            platform.manage: Propose, decide and apply platform configuration/feature/policy changes and provision platform staff.
            reconciliation.manage: Run independent ledger-consistency matching for an invoice.
            invoices.cancel: Cancel a certified invoice under officer-only, step-up authority.
            notifications.manage: Queue notifications directly to a user or taxpayer.
            dashboard.read: Read personal dashboard and notification data available to every role.
            obligations.manage: Record and satisfy compliance obligations.
            vat-rules.read: Read VAT rules and evaluate the applicable rate for a tax category and date.
            vat-rules.manage: Propose and approve VAT rules under maker-checker control.
            accounting.close-period: Close accounting periods so their ledger entries become immutable.
            parties.manage: Manage business party (customer/supplier) records and counterparty-trust verification.
            developer.manage: Manage developer platform API clients, credentials and SaaS provider registrations.
            developer.read: Read developer platform / SaaS provider usage data.
            security.read: Read the SOC incident queue and incident detail.
            security.manage: Manage security incidents (create, contain, close, revoke access).
            taxpayers.read: Read taxpayer identity and identifier data.
            taxpayers.suspend: Suspend taxpayers and correct canonical taxpayer identifiers.
            risk.review: Evaluate and review taxpayer risk indicators.
            documents.read: Read tenant-scoped evidence document metadata, version history and bytes.
            documents.manage: Manage quarantined/active document lifecycle state (scan results, retention holds).
            risk.read: Read restricted, nationally-scoped risk indicators.
            workflows.read: Read workflow delegations and dry-run a workflow version.
            workflows.manage: Create and revoke workflow delegations and assign workflow instances.
            communications.manage: Send an outbound compliance notice or close a correspondence thread (national compliance roles only).
            exceptions.read: Read the reconciliation exception work queue.
            payments.read: Read the outstanding refund payment queue.
            payments.record: Record and allocate refund payment instructions.
            refunds.read: Read refund claim eligibility checks.
            registrations.approve: Independently decide a registration application.
            taxpayer-systems.read: Read registered taxpayer ERP/POS/accounting system registrations.
            taxpayer-systems.manage: Register, suspend and record synchronisation state for a taxpayer's own ERP/POS/accounting system.
            taxpayer-systems.approve: Approve a taxpayer's registered system so it may exchange invoice data with NamRA e-VAT MS (national compliance roles only).
            fixed-assets.read: Read immovable and movable fixed asset records.
            fixed-assets.manage: Register, revalue, flag for maintenance, restore and dispose immovable and movable fixed asset records.
            logistics.read: Read logistics delivery records.
            logistics.manage: Create, dispatch, deliver and cancel logistics delivery records.
  parameters:
    StepUpEvidence:
      name: X-VAT-MSA-Step-Up-Evidence
      in: header
      required: true
      description: HMAC-SHA256 v2 claims envelope issued by the configured trusted identity broker and bound to actor, MFA method, issuer, session, request method/path and origin. It expires within five minutes and is single-use.
      schema: { type: string, pattern: '^v2\.[A-Za-z0-9_-]{32,2048}\.[A-Za-z0-9_-]{32,128}$' }
    StepUpSessionId:
      name: X-VAT-MSA-Session-ID
      in: header
      required: true
      description: Application session identifier that must exactly match the signed sid claim in the step-up evidence.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key unique to the client and business operation. Reuse with a different body is rejected.
      schema: { type: string, minLength: 16, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrganisationId:
      name: organisation_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    OrganisationScope:
      name: organisation_id
      in: query
      required: false
      description: National-pilot operators may select an organisation; taxpayer identities are always forced to their own organisation.
      schema: { type: string, minLength: 1, maxLength: 100 }
    VatPeriodId:
      name: period_id
      in: path
      required: true
      schema: { type: string, minLength: 2, maxLength: 100 }
    VatReturnVersionId:
      name: return_version_id
      in: path
      required: true
      schema: { type: string, minLength: 2, maxLength: 100 }
    ApprovalTaskId:
      name: approval_task_id
      in: path
      required: true
      schema: { type: string, minLength: 2, maxLength: 100 }
  headers:
    CorrelationId:
      description: End-to-end trace identifier.
      schema: { type: string, format: uuid }
  schemas:
    SelfServeSignupSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, applicant_name, applicant_role, contact_email, country_code, plan_code, vat_number, tin, legal_name, taxpayer_type, return_frequency, address, company_system_administrator_attested, terms_accepted, privacy_notice_accepted]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        applicant_name: { type: string, minLength: 2, maxLength: 120 }
        applicant_role: { type: string, enum: [OWNER, DIRECTOR, PARTNER, TRUSTEE, AUTHORISED_REPRESENTATIVE] }
        contact_email: { type: string, format: email, maxLength: 254 }
        country_code: { type: string, const: NA }
        plan_code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,39}$'
          description: Configurable active placeholder plan; no price or payment data is accepted.
        vat_number: { type: string, minLength: 3, maxLength: 40 }
        tin: { type: string, minLength: 3, maxLength: 40 }
        company_registration_number: { type: string, minLength: 3, maxLength: 40 }
        legal_name: { type: string, minLength: 2, maxLength: 200 }
        trading_name: { type: string, minLength: 2, maxLength: 200 }
        taxpayer_type: { type: string, enum: [PRIVATE_COMPANY, CLOSE_CORPORATION, SOLE_PROPRIETOR, PARTNERSHIP, TRUST, NON_PROFIT, PUBLIC_ENTITY, OTHER] }
        return_frequency: { type: string, enum: [MONTHLY, BIMONTHLY, QUARTERLY, ANNUAL] }
        address: { type: string, minLength: 5, maxLength: 500 }
        company_system_administrator_attested:
          type: boolean
          const: true
          description: Ordinary employees must use invitation/sign-in and cannot initiate a company subscription.
        terms_accepted: { type: boolean, const: true }
        privacy_notice_accepted: { type: boolean, const: true }
    SelfServeSignupAccepted:
      type: object
      additionalProperties: false
      required: [application_reference, status, identity_status, taxpayer_verification_status, licence_status, submitted_at, next_action]
      properties:
        application_reference: { type: string, pattern: '^VMS-[0-9]{4}-[A-F0-9]{10}$' }
        status: { type: string, const: PENDING_VERIFICATION }
        identity_status: { type: string, enum: [VERIFICATION_REQUIRED, EXTERNALLY_ASSERTED] }
        taxpayer_verification_status: { type: string, const: AWAITING_PROVIDER_CONTRACT }
        licence_status: { type: string, const: NOT_ACTIVATED }
        submitted_at: { type: string, format: date-time }
        next_action: { type: string, maxLength: 500 }
    AuthorityDomain:
      type: string
      enum: [GOVERNMENT_TAX, COMMERCIAL_SAAS, PLATFORM_CONTROL]
    CapacityMode:
      type: string
      enum: [FINITE, UNLIMITED, NOT_APPLICABLE]
      description: UNLIMITED is explicit and is never inferred from NULL or a large numeric value.
    OrganisationSummary:
      type: object
      additionalProperties: false
      required: [id, taxpayer_id, legal_name, vat_number, tin, status, branch_count, member_count, capabilities]
      properties:
        id: { type: string, maxLength: 100 }
        taxpayer_id: { type: string, maxLength: 100 }
        legal_name: { type: string, maxLength: 200 }
        trading_name: { type: [string, 'null'], maxLength: 200 }
        vat_number: { type: string, maxLength: 40 }
        tin: { type: string, maxLength: 40 }
        status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        branch_count: { type: integer, minimum: 0 }
        member_count: { type: integer, minimum: 0 }
        capabilities:
          type: string
          description: Comma-separated pilot projection; future contract versions return a typed array.
    RegistrationSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, vat_number, tin, legal_name, taxpayer_type, return_frequency, address, email]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        vat_number: { type: string, minLength: 3, maxLength: 40 }
        tin: { type: string, minLength: 3, maxLength: 40 }
        company_registration_number: { type: string, minLength: 3, maxLength: 40 }
        legal_name: { type: string, minLength: 2, maxLength: 200 }
        trading_name: { type: string, minLength: 2, maxLength: 200 }
        taxpayer_type: { type: string, enum: [PRIVATE_COMPANY, CLOSE_CORPORATION, SOLE_PROPRIETOR, PARTNERSHIP, TRUST, NON_PROFIT, PUBLIC_ENTITY, OTHER] }
        return_frequency: { type: string, enum: [MONTHLY, BIMONTHLY, QUARTERLY, ANNUAL] }
        address: { type: string, minLength: 5, maxLength: 500 }
        email: { type: string, format: email, maxLength: 254 }
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required: [registration_id, status, verification_source, verification_status, proofing_case_id, identity_proofing_status, submitted_at, next_action]
      properties:
        registration_id: { type: string, format: uuid }
        status: { type: string, const: PENDING_VERIFICATION }
        verification_source: { type: string, const: ITAS }
        verification_status: { type: string, const: AWAITING_PROVIDER_CONTRACT }
        proofing_case_id: { type: string, format: uuid }
        identity_proofing_status: { type: string, const: PENDING_PROVIDER }
        submitted_at: { type: string, format: date-time }
        next_action: { type: string }
    IdentityProofingCase:
      type: object
      additionalProperties: false
      required: [id, subject_type, subject_reference, provider, provider_environment, status, confidence_bps, reason_code, requested_by, created_at, updated_at]
      properties:
        id: { type: string, maxLength: 100 }
        subject_type: { type: string, enum: [TAXPAYER_REGISTRATION, USER_IDENTITY] }
        subject_reference: { type: string, maxLength: 100 }
        registration_application_id: { type: [string, 'null'], maxLength: 100 }
        provider: { type: string, enum: [ITAS] }
        provider_environment: { type: string, enum: [CONTRACT_PENDING, SYNTHETIC_TEST, PRODUCTION_EQUIVALENT, PRODUCTION] }
        status: { type: string, enum: [PENDING_PROVIDER, CANDIDATE_FOUND, DUPLICATE_CONFIRMED, MISMATCH, MANUAL_REVIEW, SYNTHETIC_MATCHED, AUTHORITY_VERIFIED, REJECTED] }
        confidence_bps: { type: integer, minimum: 0, maximum: 10000 }
        matched_taxpayer_id: { type: [string, 'null'], maxLength: 100 }
        reason_code: { type: string, maxLength: 100 }
        requested_by: { type: string, maxLength: 100 }
        reviewed_by: { type: [string, 'null'], maxLength: 100 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        reviewed_at: { type: [string, 'null'], format: date-time }
        mismatch_status: { type: [string, 'null'], enum: [OPEN, RESOLVED, REJECTED, null] }
        conflicting_fields:
          type: [string, 'null']
          description: Minimized JSON field-name list; raw provider evidence is not returned.
    QuotationSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, customer_party_id, quotation_number, currency, issue_date, valid_until, lines]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        customer_party_id: { type: string, minLength: 2, maxLength: 100 }
        branch_id: { type: string, minLength: 2, maxLength: 100 }
        quotation_number: { type: string, minLength: 2, maxLength: 40 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        issue_date: { type: string, format: date }
        valid_until: { type: string, format: date }
        notes: { type: string, maxLength: 2000 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [description, quantity_micros, unit_code, unit_price_cents, tax_category, tax_rate_bps]
            properties:
              product_id: { type: string, minLength: 2, maxLength: 100 }
              description: { type: string, minLength: 2, maxLength: 500 }
              quantity_micros: { type: integer, minimum: 1 }
              unit_code: { type: string, minLength: 1, maxLength: 12 }
              unit_price_cents: { type: integer, minimum: 0 }
              tax_category: { type: string, enum: [STANDARD, ZERO_RATED, EXEMPT, OUT_OF_SCOPE] }
              tax_rate_bps: { type: integer, minimum: 0, maximum: 10000 }
    QuotationConversionSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, invoice_number, issue_date]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        invoice_number: { type: string, minLength: 2, maxLength: 100, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{1,99}$' }
        issue_date: { type: string, format: date }
        due_date: { type: string, format: date }
    QuotationRejectionSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, reason]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        reason: { type: string, minLength: 5, maxLength: 500 }
    JournalSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, journal_number, journal_date, description, currency, source_type, lines]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        journal_number: { type: string, minLength: 2, maxLength: 40 }
        journal_date: { type: string, format: date }
        reference: { type: string, maxLength: 100 }
        description: { type: string, minLength: 2, maxLength: 500 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        source_type: { type: string, enum: [MANUAL, EXPENSE, INVOICE, IMPORT, ADJUSTMENT] }
        source_id: { type: string, minLength: 2, maxLength: 100 }
        lines:
          type: array
          minItems: 2
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [account_id, description, debit_cents, credit_cents]
            properties:
              account_id: { type: string, minLength: 2, maxLength: 100 }
              branch_id: { type: string, minLength: 2, maxLength: 100 }
              project_id: { type: string, minLength: 2, maxLength: 100 }
              description: { type: string, minLength: 2, maxLength: 500 }
              debit_cents: { type: integer, minimum: 0 }
              credit_cents: { type: integer, minimum: 0 }
              tax_code: { type: string, maxLength: 40 }
    ExpenseSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, category_id, expense_number, expense_date, description, currency, net_cents, tax_cents, total_cents]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        category_id: { type: string, minLength: 2, maxLength: 100 }
        supplier_party_id: { type: string, minLength: 2, maxLength: 100 }
        project_id: { type: string, minLength: 2, maxLength: 100 }
        branch_id: { type: string, minLength: 2, maxLength: 100 }
        expense_number: { type: string, minLength: 2, maxLength: 40 }
        expense_date: { type: string, format: date }
        description: { type: string, minLength: 2, maxLength: 500 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        net_cents: { type: integer, minimum: 0 }
        tax_cents: { type: integer, minimum: 0 }
        total_cents: { type: integer, minimum: 0 }
    ExpenseDecisionSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, decision, reason]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        decision: { type: string, enum: [APPROVE, REJECT] }
        reason: { type: string, minLength: 5, maxLength: 500 }
    ExpenseReceiptLinkSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, receipt_document_id]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        receipt_document_id: { type: string, minLength: 2, maxLength: 100 }
    StockMovementSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, warehouse_id, product_id, movement_type, quantity_micros, unit_cost_cents, reference_type, reference_id, reason]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        warehouse_id: { type: string, minLength: 2, maxLength: 100 }
        product_id: { type: string, minLength: 2, maxLength: 100 }
        movement_type: { type: string, enum: [RECEIPT, ISSUE, TRANSFER_IN, TRANSFER_OUT, ADJUSTMENT_IN, ADJUSTMENT_OUT] }
        quantity_micros: { type: integer, minimum: 1 }
        unit_cost_cents: { type: integer, minimum: 0 }
        reference_type: { type: string, minLength: 2, maxLength: 40 }
        reference_id: { type: string, minLength: 2, maxLength: 100 }
        reason: { type: string, minLength: 2, maxLength: 500 }
        occurred_at: { type: string, format: date-time }
    ProjectSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, code, name, currency, start_date]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        code: { type: string, minLength: 2, maxLength: 40 }
        name: { type: string, minLength: 2, maxLength: 200 }
        customer_party_id: { type: string, minLength: 2, maxLength: 100 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        budget_cents: { type: integer, minimum: 0 }
    VatAdjustmentSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, adjustment_type, direction, amount_cents, reason_code, explanation]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        adjustment_type: { type: string, enum: [OUTPUT_TAX, INPUT_TAX, NET_PAYABLE] }
        direction: { type: string, enum: [INCREASE, DECREASE] }
        amount_cents: { type: integer, minimum: 1 }
        reason_code: { type: string, minLength: 2, maxLength: 40 }
        explanation: { type: string, minLength: 10, maxLength: 2000 }
        evidence_document_id: { type: string, minLength: 2, maxLength: 100 }
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision, comment]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT] }
        comment: { type: string, minLength: 5, maxLength: 1000 }
    CaseOpeningSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, taxpayer_id, case_type, title, opening_reason, risk_tier]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        taxpayer_id: { type: string, minLength: 2, maxLength: 100 }
        case_type: { type: string, enum: [DESK_REVIEW, VAT_AUDIT, REFUND_VERIFICATION, INVESTIGATION] }
        title: { type: string, minLength: 5, maxLength: 200 }
        opening_reason: { type: string, minLength: 20, maxLength: 2000 }
        risk_tier: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    DisputeSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, disputed_resource_type, disputed_resource_id, grounds, disputed_amount_cents, currency]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        taxpayer_id: { type: string, minLength: 2, maxLength: 100 }
        audit_case_id: { type: string, minLength: 2, maxLength: 100 }
        disputed_resource_type: { type: string, enum: [AUDIT_FINDING, VAT_RETURN, REFUND_DECISION, OBLIGATION] }
        disputed_resource_id: { type: string, minLength: 2, maxLength: 100 }
        grounds: { type: string, minLength: 20, maxLength: 4000 }
        disputed_amount_cents: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    RefundRequestSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, vat_return_version_id]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        vat_return_version_id: { type: string, minLength: 2, maxLength: 100 }
    RefundReviewSubmission:
      type: object
      additionalProperties: false
      required: [schema_version, stage, decision, findings]
      properties:
        schema_version: { type: string, const: 1.0.0 }
        stage: { type: string, enum: [EVIDENCE, RISK, SUPERVISOR, PAYMENT_AUTHORISATION] }
        decision: { type: string, enum: [APPROVE, REJECT, REQUEST_INFORMATION, HOLD] }
        findings: { type: string, minLength: 10, maxLength: 2000 }
    SubmissionAccepted:
      type: object
      additionalProperties: false
      required: [submission_id, status, received_at]
      properties:
        submission_id: { type: string, format: uuid }
        status: { type: string, enum: [RECEIVED, PROCESSING] }
        received_at: { type: string, format: date-time }
        status_url: { type: string, format: uri }
    CertificationReceipt:
      type: object
      additionalProperties: false
      required: [invoice_id, transaction_id, certificate_id, status, certified_at, rule_set_id, rule_set_version, legal_authority_reference, invoice_hash, signature, verification_url]
      properties:
        invoice_id: { type: string, format: uuid }
        document_type: { type: string, enum: [TAX_INVOICE, SIMPLIFIED_TAX_INVOICE, CREDIT_NOTE, DEBIT_NOTE, SELF_BILLED_INVOICE] }
        transaction_id: { type: string, format: uuid }
        certificate_id: { type: string, format: uuid }
        status: { type: string, const: CERTIFIED }
        processing_status: { type: string, enum: [CERTIFIED, MATCHED, EXCEPTION] }
        certified_at: { type: string, format: date-time }
        rule_set_id: { type: string, minLength: 1, description: Immutable identifier of the authority-approved rule resolved for the issue date. }
        rule_set_version: { type: string, minLength: 1 }
        legal_authority_reference: { type: string, minLength: 1 }
        invoice_hash: { type: string, pattern: '^[A-Fa-f0-9]{64}$', description: Certification hash binding the payload hash and approved statutory rule evidence. }
        signature: { type: string, description: JWS or equivalent approved signature container. }
        verification_url: { type: string, format: uri }
        qr_payload: { type: string }
        correction:
          type: [object, 'null']
          additionalProperties: false
          properties:
            originalInvoiceId: { type: string }
            originalInvoiceNumber: { type: string }
            correctionType: { type: string, enum: [CREDIT_NOTE, DEBIT_NOTE] }
            reasonCode: { type: [string, 'null'] }
            reason: { type: string }
            status: { type: string }
            createdAt: { type: string, format: date-time }
    InvoiceStatus:
      type: object
      additionalProperties: false
      required: [invoice_id, status, updated_at]
      properties:
        invoice_id: { type: string, format: uuid }
        status:
          type: string
          enum: [RECEIVED, VALIDATING, REJECTED, ACCEPTED, CERTIFIED, POSTED, MATCHED, EXCEPTION, REVERSED]
        updated_at: { type: string, format: date-time }
        certificate_id: { type: string, format: uuid }
        transaction_id: { type: string, format: uuid }
        exception_ids:
          type: array
          items: { type: string, format: uuid }
        validation_messages:
          type: array
          items: { $ref: '#/components/schemas/ValidationMessage' }
    ValidationMessage:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code: { type: string, maxLength: 80 }
        severity: { type: string, enum: [ERROR, WARNING, INFORMATION] }
        path: { type: string, description: JSON Pointer to the affected value. }
        message: { type: string, maxLength: 1000 }
        rule_reference: { type: string, maxLength: 100 }
    OfflineBatch:
      type: object
      additionalProperties: false
      required: [device_id, batch_id, sequence_from, sequence_to, created_at, documents, device_signature]
      properties:
        device_id: { type: string, maxLength: 100 }
        batch_id: { type: string, format: uuid }
        sequence_from: { type: integer, minimum: 1 }
        sequence_to: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        previous_batch_hash: { type: string, pattern: '^[A-Fa-f0-9]{64}$' }
        documents:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: './schemas/vat-msa-invoice.schema.json'
        device_signature: { type: string }
    OfflineBatchResponse:
      type: object
      additionalProperties: false
      required: [batch]
      properties:
        batch:
          type: object
          additionalProperties: true
          required: [id, client_batch_id, status, received_at]
          properties:
            id: { type: string, format: uuid }
            client_batch_id: { type: string, format: uuid }
            status: { type: string, enum: [REJECTED, ACCEPTED, PROCESSING, CONFLICT] }
            rejection_reason: { type: [string, 'null'], maxLength: 200 }
            received_at: { type: string, format: date-time }
    DocumentUpload:
      type: object
      additionalProperties: false
      required: [owner_domain, owner_resource_id, classification, file]
      properties:
        organisation_id: { type: string, minLength: 2, maxLength: 100 }
        owner_domain: { type: string, enum: [EXPENSE, IMPORT, AUDIT_CASE, VAT_ADJUSTMENT, REFUND, BANK_IMPORT] }
        owner_resource_id: { type: string, minLength: 2, maxLength: 100 }
        classification: { type: string, enum: [INTERNAL, CONFIDENTIAL, TAX_CONFIDENTIAL, RESTRICTED] }
        file:
          type: string
          format: binary
          maxLength: 10485760
    QuarantinedDocumentResponse:
      type: object
      additionalProperties: false
      required: [document, next_action]
      properties:
        document:
          type: object
          additionalProperties: false
          required: [id, owner_domain, owner_resource_id, file_name, content_type, size_bytes, checksum_sha256, classification, scan_status, status, uploaded_at]
          properties:
            id: { type: string, format: uuid }
            owner_domain: { type: string }
            owner_resource_id: { type: string }
            file_name: { type: string, maxLength: 180 }
            content_type: { type: string }
            size_bytes: { type: integer, minimum: 1, maximum: 10485760 }
            checksum_sha256: { type: string, pattern: '^[A-Fa-f0-9]{64}$' }
            classification: { type: string }
            scan_status: { type: string, const: PENDING_EXTERNAL_SCANNER }
            status: { type: string, const: QUARANTINED }
            uploaded_at: { type: string, format: date-time }
        next_action: { type: string }
    InlineReportResponse:
      type: object
      additionalProperties: false
      required: [report_run]
      properties:
        report_run:
          type: object
          additionalProperties: false
          required: [id, report_code, status, result_summary, requested_at]
          properties:
            id: { type: string, format: uuid }
            report_code: { type: string }
            status: { type: string, const: COMPLETED_INLINE }
            result_summary:
              type: object
              additionalProperties: { type: integer }
            requested_at: { type: string, format: date-time }
    PlatformSnapshot:
      type: object
      additionalProperties: false
      required: [integrations, clients, webhooks, syncJobs, bankImports, payments, devices, numberRanges, batches, conflicts, reportDefinitions, reportRuns, components, documents, outbox]
      properties:
        integrations: { type: array, items: { type: object, additionalProperties: true } }
        clients: { type: array, items: { type: object, additionalProperties: true } }
        webhooks: { type: array, items: { type: object, additionalProperties: true } }
        syncJobs: { type: array, items: { type: object, additionalProperties: true } }
        bankImports: { type: array, items: { type: object, additionalProperties: true } }
        payments: { type: array, items: { type: object, additionalProperties: true } }
        devices: { type: array, items: { type: object, additionalProperties: true } }
        numberRanges: { type: array, items: { type: object, additionalProperties: true } }
        batches: { type: array, items: { type: object, additionalProperties: true } }
        conflicts: { type: array, items: { type: object, additionalProperties: true } }
        reportDefinitions: { type: array, items: { type: object, additionalProperties: true } }
        reportRuns: { type: array, items: { type: object, additionalProperties: true } }
        components: { type: array, items: { type: object, additionalProperties: true } }
        documents: { type: array, items: { type: object, additionalProperties: true } }
        outbox: { type: array, items: { type: object, additionalProperties: true } }
    PublicVerification:
      type: object
      additionalProperties: false
      required: [valid, certificate_status, certified_at, supplier_display, invoice_number_masked, total_amount, currency]
      properties:
        valid: { type: boolean }
        certificate_status: { type: string, enum: [VALID, REVERSED, REVOKED, UNKNOWN] }
        certified_at: { type: string, format: date-time }
        supplier_display: { type: string, maxLength: 250 }
        invoice_number_masked: { type: string, maxLength: 100 }
        total_amount: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    LicenseState:
      type: string
      enum: [TRIAL, ACTIVE, GRACE_PERIOD, PENDING_RENEWAL, SUSPENDED, EXPIRED, CANCELLED]
      description: Server-authoritative organisation licence state; clients cannot select or change it.
    Problem:
      type: object
      description: RFC 9457-compatible problem detail.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code:
          type: string
          description: Stable denial or validation code, including FEATURE_NOT_ENTITLED, LICENSE_SUSPENDED, LICENSE_EXPIRED, LICENSE_CANCELLED, GRACE_PERIOD_NO_EXPANSION or LICENSE_POLICY_MISSING.
        instance: { type: string, format: uri-reference }
        correlation_id: { type: string, format: uuid }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationMessage' }
  responses:
    BadRequest:
      description: Malformed request.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Authentication failed.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Authenticated identity lacks permission/scope, the feature is not entitled, or licence state forbids the operation class. Restricted licence states never delete historical records.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Resource not found or not visible to the caller.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Duplicate, sequence conflict or idempotency-key body mismatch.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ValidationFailed:
      description: Canonical or business-rule validation failed.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    RateLimited:
      description: Client or taxpayer rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unavailable:
      description: Temporary dependency or platform failure; retry only with the same idempotency key.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
