catalog_version: 0.5.0
envelope:
  specification: CloudEvents 1.0
  required_attributes: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
  delivery: at-least-once
  ordering: guaranteed only within the declared aggregate partition
  idempotency: consumers persist event id and business-effect key
  compatibility: additive changes only within a major event version
events:
  - type: na.vatmsa.document.quarantined.v1
    owner: Evidence Custody Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records the private object key, integrity checksum and pending external malware-scan state without making the object consumable.
  - type: na.vatmsa.offline.batch-rejected.v1
    owner: Offline Synchronisation Domain
    partition_key: device_id
    contains_tax_confidential_data: true
    purpose: Preserves an untrusted, replayed, out-of-sequence or unverifiable batch attempt and its explicit rejection reason.
  - type: na.vatmsa.report.completed-inline.v1
    owner: Reporting Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records completion of a controlled tenant-scoped aggregate report without exposing its result payload to the event stream.
  - type: na.vatmsa.dispute.filed.v1
    owner: Dispute Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records an immutable taxpayer challenge for independent review.
  - type: na.vatmsa.refund.requested.v1
    owner: Refund Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Starts staged evidence and risk review only after statutory filing eligibility.
  - type: na.vatmsa.refund.request-blocked.v1
    owner: Refund Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records a negative position that cannot advance because the return is not acknowledged as filed.
  - type: na.vatmsa.refund.reviewed.v1
    owner: Refund Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records one staged human review without creating a payment by itself.
  - type: na.vatmsa.return.approval-requested.v1
    owner: VAT Return Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Places an immutable return version into maker-checker approval.
  - type: na.vatmsa.return.approved.v1
    owner: VAT Return Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records independent approval and locks the VAT period against ordinary writes.
  - type: na.vatmsa.return.rejected.v1
    owner: VAT Return Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records independent rejection and reopens the period for a superseding version.
  - type: na.vatmsa.return.submission-blocked.v1
    owner: ITAS Integration Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Makes missing authority rules or provider configuration explicit without claiming legal filing.
  - type: na.vatmsa.adjustment.approval-requested.v1
    owner: VAT Return Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records a proposed VAT adjustment that has no return effect until independently approved.
  - type: na.vatmsa.quotation.issued.v1
    owner: Commercial Domain
    partition_key: organisation_id
    contains_tax_confidential_data: true
    purpose: Announces a server-calculated quotation without treating it as a fiscal invoice.
  - type: na.vatmsa.quotation.accepted.v1
    owner: Commercial Domain
    partition_key: organisation_id
    contains_tax_confidential_data: true
    purpose: Records the authorised acceptance of an unexpired quotation.
  - type: na.vatmsa.journal.posted.v1
    owner: Accounting Domain
    partition_key: organisation_id
    contains_tax_confidential_data: true
    purpose: Announces an immutable, balanced general-ledger journal.
  - type: na.vatmsa.expense.recorded.v1
    owner: Expense Domain
    partition_key: organisation_id
    contains_tax_confidential_data: true
    purpose: Records a tenant-scoped expense pending its evidence and approval workflow.
  - type: na.vatmsa.inventory.movement-recorded.v1
    owner: Inventory Domain
    partition_key: organisation_id
    contains_tax_confidential_data: true
    purpose: Announces a signed stock movement after the non-negative balance invariant is satisfied.
  - type: na.vatmsa.project.created.v1
    owner: Project Domain
    partition_key: organisation_id
    contains_tax_confidential_data: true
    purpose: Creates a project control object and optional proposed budget.
  - type: na.vatmsa.invoice.received.v1
    owner: Invoice Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Confirms durable receipt before business validation.
  - type: na.vatmsa.invoice.rejected.v1
    owner: Invoice Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records terminal validation failure and structured reasons.
  - type: na.vatmsa.invoice.certified.v1
    owner: Certification Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Announces signed certification after invoice and VAT transaction commit.
  - type: na.vatmsa.vat.posted.v1
    owner: VAT Ledger Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Announces balanced VAT sub-ledger posting.
  - type: na.vatmsa.match.resolved.v1
    owner: Reconciliation Domain
    partition_key: transaction_id
    contains_tax_confidential_data: true
    purpose: Records the counterpart match decision, confidence and evidence.
  - type: na.vatmsa.exception.opened.v1
    owner: Exception Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Opens a controlled discrepancy workflow.
  - type: na.vatmsa.exception.resolved.v1
    owner: Exception Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Records disposition, evidence and authorised actor.
  - type: na.vatmsa.return.drafted.v1
    owner: Return Domain
    partition_key: taxpayer_period_id
    contains_tax_confidential_data: true
    purpose: Announces a reproducible return draft built from a closed ledger snapshot.
  - type: na.vatmsa.risk.alerted.v1
    owner: Risk Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Raises explainable risk indicators; does not itself impose an adverse decision.
  - type: na.vatmsa.audit.case-opened.v1
    owner: Audit Domain
    partition_key: taxpayer_id
    contains_tax_confidential_data: true
    purpose: Creates an investigation case with immutable evidence references.
  - type: na.vatmsa.offline.batch-received.v1
    owner: Offline Synchronisation Domain
    partition_key: device_id
    contains_tax_confidential_data: true
    purpose: Records batch sequence, device signature and chain-integrity result.
