version: 1
base_path: /api/v1
common_controls:
  authentication: human OIDC/SAML session or registered machine identity
  authorization: RBAC plus ABAC plus tenant/resource ownership plus entitlement workflow SoD and security policy
  correlation: X-Correlation-Id required or server-generated
  errors: application/problem+json
  idempotency: required for financial and tax commands
  limits: schema byte page query and multi-level rate budgets
domains:
  signup:
    - { method: POST, path: /signup-applications, permission: public-company-admin-attestation-rate-limited, authority_domain: COMMERCIAL_SAAS, status: implemented-pending-verification-no-activation }
  tax_authority_subscription:
    - { method: POST, path: "/tax-authorities/{authorityId}/subscriptions", permission: tax-authority-admin-step-up, authority_domain: GOVERNMENT_TAX, status: architecture-gated-disabled-local-staging }
    - { method: POST, path: "/tax-authorities/{authorityId}/taxpayer-authorizations", permission: tax-authority-admin-step-up, authority_domain: GOVERNMENT_TAX, status: synthetic-foundation }
  dual_authorization:
    - { method: POST, path: /tax-access/decision, permission: authenticated-tax-scope, authority_domain: GOVERNMENT_TAX, status: implemented-central-decision-foundation }
    - { method: GET, path: /licensing/license, permission: licensing:read, authority_domain: COMMERCIAL_SAAS, status: implemented-central-decision-foundation }
  identity:
    - { method: GET, path: /identity/federation-status, permission: identity:read, status: foundation }
    - { method: POST, path: /auth/token-exchange, permission: external-provider-contract, status: gated-by-ITAS }
  taxpayers:
    - { method: GET, path: /taxpayers, permission: taxpayers:read, status: planned }
    - { method: POST, path: /registration-applications, permission: registrations:submit, status: implemented-pending-ITAS-verification }
    - { method: GET, path: "/registration-applications/{id}", permission: registrations:review-or-owner, status: planned }
  organisations:
    - { method: GET, path: /organisations, permission: identity:read, status: implemented }
    - { method: GET, path: "/organisations/{id}", permission: identity:read-and-member, status: implemented }
    - { method: POST, path: "/organisations/{id}/memberships", permission: organisation:users:manage, status: planned }
  users:
    - { method: GET, path: /users, permission: users:read, status: planned }
    - { method: POST, path: "/users/{id}/role-assignments", permission: users:roles:manage, status: planned }
  business_parties:
    - { method: GET, path: /business-parties, permission: parties:manage, status: implemented }
    - { method: POST, path: /business-parties, permission: parties:manage, status: implemented }
    - { method: PATCH, path: "/business-parties/{id}", permission: parties:manage-and-resource-scope, status: implemented }
    - { method: POST, path: "/business-parties/{id}/deactivation", permission: parties:manage-and-resource-scope, status: implemented-non-destructive }
  quotations:
    - { method: POST, path: /quotations, permission: quotations:manage, status: implemented }
    - { method: PATCH, path: "/quotations/{id}", permission: quotations:manage-and-resource-scope, status: implemented-issued-only-with-revisions }
    - { method: POST, path: "/quotations/{id}/accept", permission: quotations:manage-and-resource-scope, status: implemented }
    - { method: POST, path: "/quotations/{id}/rejection", permission: quotations:manage-and-resource-scope, status: implemented }
    - { method: POST, path: "/quotations/{id}/expiration", permission: quotations:manage-and-resource-scope, status: implemented-overdue-only }
    - { method: POST, path: "/quotations/{id}/convert", permission: invoices:submit, status: implemented }
  invoices:
    - { method: GET, path: /invoices, permission: invoices:read, status: implemented }
    - { method: POST, path: /invoices, permission: invoices:submit, status: implemented }
    - { method: GET, path: "/invoices/{id}", permission: invoices:read-and-resource-scope, status: implemented }
    - { method: POST, path: "/invoices/{id}/credit-notes", permission: credit-notes:create, status: phase-6 }
  verification:
    - { method: GET, path: "/verify/{token}", permission: public-minimal, status: implemented }
  vat:
    - { method: GET, path: /vat/transactions, permission: vat:read, status: phase-6 }
    - { method: GET, path: /tax-rules, permission: tax-rules:read, status: foundation }
  returns:
    - { method: GET, path: /vat-returns, permission: returns:read, status: planned }
    - { method: POST, path: "/vat-returns/{id}/submit", permission: returns:submit, status: gated-by-NamRA-rules }
  reconciliation:
    - { method: GET, path: /reconciliation/exceptions, permission: exceptions:read, status: planned }
    - { method: POST, path: "/reconciliation/exceptions/{id}/resolve", permission: exceptions:resolve, status: planned }
  accounting:
    - { method: GET, path: /journals, permission: accounting:read, status: planned }
    - { method: POST, path: /journals, permission: accounting:post, status: planned }
  inventory:
    - { method: GET, path: /stock-movements, permission: inventory:read, status: planned }
    - { method: POST, path: /stock-movements, permission: inventory:move, status: planned }
  expenses:
    - { method: GET, path: /expenses, permission: expenses:read, status: implemented }
    - { method: POST, path: /expenses, permission: expenses:manage, status: implemented-draft-only }
    - { method: POST, path: "/expenses/{id}/receipt", permission: expenses:manage, status: implemented-clean-evidence-only }
    - { method: POST, path: "/expenses/{id}/decision", permission: expenses:approve, status: implemented-no-self-approval }
  projects:
    - { method: GET, path: /projects, permission: projects:read, status: planned }
    - { method: POST, path: /projects, permission: projects:create, status: planned }
  audit:
    - { method: GET, path: /audit/events, permission: audit:read, status: planned }
  documents:
    - { method: POST, path: /documents, permission: documents:create, status: phase-9-r2 }
    - { method: GET, path: "/documents/{id}/download-ticket", permission: documents:read, status: planned }
  notifications:
    - { method: GET, path: /notifications, permission: notifications:read, status: planned }
    - { method: PUT, path: /notification-preferences, permission: notifications:manage-own, status: planned }
  reporting:
    - { method: POST, path: /reports, permission: reports:generate, status: planned }
    - { method: GET, path: "/report-jobs/{id}", permission: reports:read-own-or-authorized, status: planned }
  developer:
    - { method: POST, path: /developer/clients, permission: developer-clients:create, status: planned }
    - { method: POST, path: "/developer/clients/{id}/rotate", permission: developer-clients:manage, status: planned }
  integrations:
    - { method: GET, path: /integrations, permission: integrations:read, status: foundation }
    - { method: POST, path: "/integrations/{id}/credentials/rotate", permission: integrations:manage, status: managed-secret-service }
  operations:
    - { method: GET, path: /health/live, permission: platform-probe, status: implemented }
    - { method: GET, path: /health/ready, permission: platform-probe, status: implemented }
  licensing:
    - { method: GET, path: /licensing/license, permission: licensing:read, status: architecture-proposed-pending-approval }
    - { method: GET, path: /licensing/entitlements, permission: licensing:entitlements:read, status: architecture-proposed-pending-approval }
    - { method: GET, path: /licensing/usage, permission: licensing:usage:read, status: architecture-proposed-pending-approval }
    - { method: POST, path: /licensing/upgrade-requests, permission: licensing:change:request, status: gated-by-commercial-provider }
    - { method: POST, path: /licensing/renewal-requests, permission: licensing:change:request, status: gated-by-commercial-provider }
  organisation_administration:
    - { method: GET, path: "/organisations/{id}/employees", permission: organisation:employees:read, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/organisations/{id}/employees", permission: organisation:employees:create, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/organisations/{id}/invitations", permission: organisation:users:invite, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/organisations/{id}/employees/{employeeId}/disable", permission: organisation:employees:disable, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/organisations/{id}/employees/{employeeId}/terminate", permission: organisation:employees:terminate, status: architecture-proposed-pending-approval }
    - { method: GET, path: "/organisations/{id}/administrators", permission: organisation:administrators:read, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/organisations/{id}/administrator-change-requests", permission: organisation:administrators:change:request, status: step-up-and-approval-required }
    - { method: POST, path: "/organisations/{id}/job-titles", permission: organisation:job-titles:manage, status: architecture-proposed-pending-approval }
  organisation_authorization:
    - { method: GET, path: /organisation-roles, permission: organisation:roles:read, status: architecture-proposed-pending-approval }
    - { method: POST, path: /organisation-roles, permission: organisation:roles:create, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/organisation-roles/{id}/permissions", permission: organisation:permissions:assign, status: protected-catalogue-required }
    - { method: POST, path: "/users/{id}/organisation-roles", permission: organisation:roles:assign, status: privileged-grant-policy-required }
    - { method: POST, path: "/users/{id}/capabilities", permission: organisation:capabilities:assign, status: entitlement-and-org-capability-required }
  workflows:
    - { method: POST, path: /workflows, permission: workflows:create, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/workflows/{id}/tests", permission: workflows:test, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/workflows/{id}/publication-requests", permission: workflows:publish:request, status: approval-required }
    - { method: GET, path: "/workflows/{id}/versions", permission: workflows:versions:read, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/workflow-instances/{id}/decisions", permission: workflows:decide, status: sod-and-authority-required }
    - { method: POST, path: "/workflow-assignments/{id}/delegations", permission: workflows:delegate, status: no-authority-amplification }
  access_governance:
    - { method: POST, path: /access-requests, permission: access:request, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/access-requests/{id}/decisions", permission: access:approve, status: workflow-and-sod-required }
    - { method: GET, path: /access-reviews, permission: access-reviews:read, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/access-reviews/{id}/certifications", permission: access-reviews:certify, status: architecture-proposed-pending-approval }
  navigation:
    - { method: GET, path: /navigation/workspace, permission: navigation:read-effective, status: architecture-proposed-pending-approval }
    - { method: GET, path: "/navigation/workspaces/{id}/children", permission: navigation:read-effective, status: architecture-proposed-pending-approval }
    - { method: GET, path: /navigation/actions, permission: navigation:read-effective, status: architecture-proposed-pending-approval }
    - { method: PUT, path: /navigation/preferences, permission: navigation:preferences:manage-own, status: architecture-proposed-pending-approval }
  search:
    - { method: GET, path: /search, permission: search:query-effective, status: architecture-proposed-pending-approval }
  jurisdiction:
    - { method: GET, path: /jurisdictions/effective, permission: jurisdiction:read-effective, status: architecture-proposed-pending-approval }
    - { method: POST, path: /jurisdiction-migration-cases, permission: jurisdiction:migration:request, status: regulatory-approval-required }
    - { method: POST, path: "/jurisdiction-migration-cases/{id}/decisions", permission: jurisdiction:migration:approve, status: sod-and-regulatory-approval-required }
  country_packs:
    - { method: GET, path: "/country-packs/{countryCode}/versions", permission: country-packs:versions:read, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/country-packs/{countryCode}/validation", permission: country-packs:validate, status: synthetic-validation-only }
    - { method: POST, path: "/country-packs/{countryCode}/approval-requests", permission: country-packs:approve:request, status: step-up-sod-and-signature-required }
    - { method: POST, path: "/country-packs/{countryCode}/activation-requests", permission: country-packs:activate:request, status: country-readiness-gate-required }
  currencies:
    - { method: GET, path: /currencies, permission: currencies:read, status: architecture-proposed-pending-approval }
    - { method: GET, path: /currency-rates, permission: currency-rates:read, status: source-policy-required }
    - { method: POST, path: /currency-rates/manual-requests, permission: currency-rates:manual:request, status: dual-approval-required }
  tax_determination:
    - { method: POST, path: /tax-determinations/preview, permission: tax-determinations:preview, status: synthetic-only-until-country-approved }
    - { method: GET, path: "/tax-rule-versions/{id}", permission: tax-rules:versions:read, status: architecture-proposed-pending-approval }
  document_templates:
    - { method: GET, path: /document-templates/effective, permission: document-templates:read-effective, status: country-version-required }
  country_readiness:
    - { method: GET, path: "/country-readiness/{countryCode}", permission: country-readiness:read, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/country-readiness/{countryCode}/decisions", permission: country-readiness:decide, status: independent-approver-and-step-up-required }
  security_profiles:
    - { method: GET, path: "/security-profiles/{profileId}/versions", permission: security-profiles:versions:read, status: architecture-proposed-non-executable }
    - { method: POST, path: "/security-profiles/{profileId}/validation", permission: security-profiles:validate, status: synthetic-validation-only }
    - { method: POST, path: "/security-profiles/{profileId}/approval-requests", permission: security-profiles:approve:request, status: independent-quorum-step-up-and-signature-required }
    - { method: POST, path: "/security-profiles/{profileId}/activation-requests", permission: security-profiles:activate:request, status: security-and-country-readiness-required }
  privileged_access:
    - { method: POST, path: /privileged-access-requests, permission: privileged-access:request, status: step-up-jit-and-independent-approval-required }
    - { method: GET, path: "/privileged-access-requests/{id}", permission: privileged-access:read, status: purpose-and-scope-required }
    - { method: POST, path: "/privileged-access-requests/{id}/decisions", permission: privileged-access:approve, status: no-self-approval-and-quorum-by-risk }
  security_operations:
    - { method: GET, path: /security/posture, permission: security-posture:read, status: evidence-freshness-and-role-projection-required }
    - { method: GET, path: /security/detections, permission: security-detections:read, status: soc-purpose-and-clearance-required }
    - { method: POST, path: /security/incidents, permission: security-incidents:declare, status: incident-authority-required }
    - { method: POST, path: "/security/incidents/{id}/response-actions", permission: security-incidents:respond, status: bounded-playbook-or-human-approval-required }
    - { method: GET, path: "/security/incidents/{id}/evidence", permission: security-evidence:read, status: chain-of-custody-purpose-and-legal-hold-required }
  vulnerability_management:
    - { method: GET, path: /security/vulnerabilities, permission: vulnerabilities:read, status: architecture-proposed-pending-approval }
    - { method: POST, path: "/security/vulnerabilities/{id}/risk-decisions", permission: vulnerabilities:risk-decide, status: expiring-independent-approval-required }
  privacy_governance:
    - { method: GET, path: /privacy/processing-activities, permission: privacy-processing:read, status: privacy-purpose-required }
    - { method: POST, path: /privacy/rights-requests, permission: privacy-rights:create, status: jurisdiction-and-identity-assurance-required }
    - { method: POST, path: /privacy/impact-assessments, permission: privacy-impact:create, status: privacy-legal-review-required }
    - { method: POST, path: /privacy/transfer-decisions, permission: privacy-transfer:decide, status: legal-privacy-security-approval-required }
  compliance_evidence:
    - { method: GET, path: "/compliance/controls/{controlId}/evidence", permission: compliance-evidence:read, status: read-only-purpose-and-classification-required }
    - { method: POST, path: "/compliance/evidence/{evidenceId}/verification", permission: compliance-evidence:verify, status: independent-reviewer-required }
  recovery_assurance:
    - { method: GET, path: /recovery/assurance, permission: recovery-assurance:read, status: security-and-operations-purpose-required }
    - { method: POST, path: /recovery/exercise-results, permission: recovery-exercises:record, status: signed-evidence-and-independent-signoff-required }
